<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZIO Logging round 3 marks at 16, 24, 32 and 96 px</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#985A00}a:hover{color:#15171C}
</style>
</helmet>
<div style="width: 1120px; height: 960px; box-sizing: border-box; padding: 48px 56px; background: #F5F4F0; font-family: Geist, system-ui, sans-serif; color: #15171C; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #5B606B">True size · 16 px uses the small cut (16-unit grid), 24 px and up the master (24-unit grid)</div>
    <h2 style="margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -0.01em">Round 3 · 16 · 24 · 32 · 96 px</h2>
  </div>

  <div style="display: grid; grid-template-columns: 140px repeat(2, minmax(0, 1fr)); font-family: 'Geist Mono', monospace; font-size: 12px; color: #5B606B; letter-spacing: 0.08em; text-transform: uppercase">
    <div></div><div style="padding-left: 24px">Light</div><div style="padding-left: 24px">Dark</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">

    <!-- Ref 2A -->
    <div style="display: grid; grid-template-columns: 140px repeat(2, minmax(0, 1fr)); align-items: stretch">
      <div style="font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 500; align-self: center; color: #5B606B">Ref 2A Lines</div>
      <div style="background: #FFFFFF; padding: 20px 24px; display: flex; align-items: flex-end; gap: 28px">
        <svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="2A 16 px, light" shape-rendering="crispEdges"><g fill="#15171C"><rect x="0" y="0" width="16" height="3"/><rect x="9" y="4" width="7" height="2"/><rect x="0" y="10" width="7" height="2"/><rect x="0" y="13" width="16" height="3"/></g><rect x="5" y="7" width="6" height="2" fill="#985A00"/></svg>
        <svg viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="2A 24 px, light" shape-rendering="crispEdges"><g fill="#15171C"><rect x="0" y="0" width="24" height="4"/><rect x="14" y="5" width="10" height="4"/><rect x="0" y="15" width="10" height="4"/><rect x="0" y="20" width="24" height="4"/></g><rect x="7" y="10" width="10" height="4" fill="#985A00"/></svg>
        <svg viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="2A 32 px, light" shape-rendering="crispEdges"><g fill="#15171C"><rect x="0" y="0" width="24" height="4"/><rect x="14" y="5" width="10" height="4"/><rect x="0" y="15" width="10" height="4"/><rect x="0" y="20" width="24" height="4"/></g><rect x="7" y="10" width="10" height="4" fill="#985A00"/></svg>
        <svg viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="2A 96 px, light" shape-rendering="crispEdges"><g fill="#15171C"><rect x="0" y="0" width="24" height="4"/><rect x="14" y="5" width="10" height="4"/><rect x="0" y="15" width="10" height="4"/><rect x="0" y="20" width="24" height="4"/></g><rect x="7" y="10" width="10" height="4" fill="#985A00"/></svg>
      </div>
      <div style="background: #111318; padding: 20px 24px; display: flex; align-items: flex-end; gap: 28px">
        <svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="2A 16 px, dark" shape-rendering="crispEdges"><g fill="#ECEDEF"><rect x="0" y="0" width="16" height="3"/><rect x="9" y="4" width="7" height="2"/><rect x="0" y="10" width="7" height="2"/><rect x="0" y="13" width="16" height="3"/></g><rect x="5" y="7" width="6" height="2" fill="#F5A524"/></svg>
        <svg viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="2A 24 px, dark" shape-rendering="crispEdges"><g fill="#ECEDEF"><rect x="0" y="0" width="24" height="4"/><rect x="14" y="5" width="10" height="4"/><rect x="0" y="15" width="10" height="4"/><rect x="0" y="20" width="24" height="4"/></g><rect x="7" y="10" width="10" height="4" fill="#F5A524"/></svg>
        <svg viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="2A 32 px, dark" shape-rendering="crispEdges"><g fill="#ECEDEF"><rect x="0" y="0" width="24" height="4"/><rect x="14" y="5" width="10" height="4"/><rect x="0" y="15" width="10" height="4"/><rect x="0" y="20" width="24" height="4"/></g><rect x="7" y="10" width="10" height="4" fill="#F5A524"/></svg>
        <svg viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="2A 96 px, dark" shape-rendering="crispEdges"><g fill="#ECEDEF"><rect x="0" y="0" width="24" height="4"/><rect x="14" y="5" width="10" height="4"/><rect x="0" y="15" width="10" height="4"/><rect x="0" y="20" width="24" height="4"/></g><rect x="7" y="10" width="10" height="4" fill="#F5A524"/></svg>
      </div>
    </div>

    <!-- 3A Tail -->
    <div style="display: grid; grid-template-columns: 140px repeat(2, minmax(0, 1fr)); align-items: stretch">
      <div style="font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 500; align-self: center">3A Tail</div>
      <div style="background: #FFFFFF; padding: 20px 24px; display: flex; align-items: flex-end; gap: 28px">
        <svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Tail 16 px, light" shape-rendering="crispEdges"><g fill="#15171C"><rect x="0" y="0" width="16" height="1"/><rect x="9" y="2" width="7" height="2"/><rect x="0" y="8" width="7" height="3"/><rect x="0" y="12" width="16" height="4"/></g><rect x="5" y="5" width="6" height="2" fill="#985A00"/></svg>
        <svg viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Tail 24 px, light" shape-rendering="crispEdges"><g fill="#15171C"><rect x="0" y="0" width="24" height="2"/><rect x="14" y="3" width="10" height="3"/><rect x="0" y="12" width="10" height="5"/><rect x="0" y="18" width="24" height="6"/></g><rect x="7" y="7" width="10" height="4" fill="#985A00"/></svg>
        <svg viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="Tail 32 px, light" shape-rendering="crispEdges"><g fill="#15171C"><rect x="0" y="0" width="24" height="2"/><rect x="14" y="3" width="10" height="3"/><rect x="0" y="12" width="10" height="5"/><rect x="0" y="18" width="24" height="6"/></g><rect x="7" y="7" width="10" height="4" fill="#985A00"/></svg>
        <svg viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Tail 96 px, light" shape-rendering="crispEdges"><g fill="#15171C"><rect x="0" y="0" width="24" height="2"/><rect x="14" y="3" width="10" height="3"/><rect x="0" y="12" width="10" height="5"/><rect x="0" y="18" width="24" height="6"/></g><rect x="7" y="7" width="10" height="4" fill="#985A00"/></svg>
      </div>
      <div style="background: #111318; padding: 20px 24px; display: flex; align-items: flex-end; gap: 28px">
        <svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Tail 16 px, dark" shape-rendering="crispEdges"><g fill="#ECEDEF"><rect x="0" y="0" width="16" height="1"/><rect x="9" y="2" width="7" height="2"/><rect x="0" y="8" width="7" height="3"/><rect x="0" y="12" width="16" height="4"/></g><rect x="5" y="5" width="6" height="2" fill="#F5A524"/></svg>
        <svg viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Tail 24 px, dark" shape-rendering="crispEdges"><g fill="#ECEDEF"><rect x="0" y="0" width="24" height="2"/><rect x="14" y="3" width="10" height="3"/><rect x="0" y="12" width="10" height="5"/><rect x="0" y="18" width="24" height="6"/></g><rect x="7" y="7" width="10" height="4" fill="#F5A524"/></svg>
        <svg viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="Tail 32 px, dark" shape-rendering="crispEdges"><g fill="#ECEDEF"><rect x="0" y="0" width="24" height="2"/><rect x="14" y="3" width="10" height="3"/><rect x="0" y="12" width="10" height="5"/><rect x="0" y="18" width="24" height="6"/></g><rect x="7" y="7" width="10" height="4" fill="#F5A524"/></svg>
        <svg viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Tail 96 px, dark" shape-rendering="crispEdges"><g fill="#ECEDEF"><rect x="0" y="0" width="24" height="2"/><rect x="14" y="3" width="10" height="3"/><rect x="0" y="12" width="10" height="5"/><rect x="0" y="18" width="24" height="6"/></g><rect x="7" y="7" width="10" height="4" fill="#F5A524"/></svg>
      </div>
    </div>

    <!-- 3B River -->
    <div style="display: grid; grid-template-columns: 140px repeat(2, minmax(0, 1fr)); align-items: stretch">
      <div style="font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 500; align-self: center; color: #985A00">3B River</div>
      <div style="background: #FFFFFF; padding: 20px 24px; display: flex; align-items: flex-end; gap: 28px">
        <svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="River 16 px, light"><g fill="#15171C"><rect x="0" y="0" width="16" height="3"/><polygon points="0,4 8,4 6,6 0,6"/><polygon points="11,4 16,4 16,6 9,6"/><polygon points="0,7 5,7 3,9 0,9"/><polygon points="8,7 16,7 16,9 6,9"/><polygon points="0,10 2,10 0,12"/><polygon points="5,10 16,10 16,12 3,12"/><rect x="0" y="13" width="16" height="3"/></g></svg>
        <svg viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="River 24 px, light"><g fill="#15171C"><rect x="0" y="0" width="24" height="4"/><polygon points="0,5 14.06,5 10.31,9 0,9"/><polygon points="19.06,5 24,5 24,9 15.31,9"/><polygon points="0,10 9.38,10 5.62,14 0,14"/><polygon points="14.38,10 24,10 24,14 10.62,14"/><polygon points="0,15 4.69,15 0.94,19 0,19"/><polygon points="9.69,15 24,15 24,19 5.94,19"/><rect x="0" y="20" width="24" height="4"/></g></svg>
        <svg viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="River 32 px, light"><g fill="#15171C"><rect x="0" y="0" width="24" height="4"/><polygon points="0,5 14.06,5 10.31,9 0,9"/><polygon points="19.06,5 24,5 24,9 15.31,9"/><polygon points="0,10 9.38,10 5.62,14 0,14"/><polygon points="14.38,10 24,10 24,14 10.62,14"/><polygon points="0,15 4.69,15 0.94,19 0,19"/><polygon points="9.69,15 24,15 24,19 5.94,19"/><rect x="0" y="20" width="24" height="4"/></g></svg>
        <svg viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="River 96 px, light"><g fill="#15171C"><rect x="0" y="0" width="24" height="4"/><polygon points="0,5 14.06,5 10.31,9 0,9"/><polygon points="19.06,5 24,5 24,9 15.31,9"/><polygon points="0,10 9.38,10 5.62,14 0,14"/><polygon points="14.38,10 24,10 24,14 10.62,14"/><polygon points="0,15 4.69,15 0.94,19 0,19"/><polygon points="9.69,15 24,15 24,19 5.94,19"/><rect x="0" y="20" width="24" height="4"/></g></svg>
      </div>
      <div style="background: #111318; padding: 20px 24px; display: flex; align-items: flex-end; gap: 28px">
        <svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="River 16 px, dark"><g fill="#ECEDEF"><rect x="0" y="0" width="16" height="3"/><polygon points="0,4 8,4 6,6 0,6"/><polygon points="11,4 16,4 16,6 9,6"/><polygon points="0,7 5,7 3,9 0,9"/><polygon points="8,7 16,7 16,9 6,9"/><polygon points="0,10 2,10 0,12"/><polygon points="5,10 16,10 16,12 3,12"/><rect x="0" y="13" width="16" height="3"/></g></svg>
        <svg viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="River 24 px, dark"><g fill="#ECEDEF"><rect x="0" y="0" width="24" height="4"/><polygon points="0,5 14.06,5 10.31,9 0,9"/><polygon points="19.06,5 24,5 24,9 15.31,9"/><polygon points="0,10 9.38,10 5.62,14 0,14"/><polygon points="14.38,10 24,10 24,14 10.62,14"/><polygon points="0,15 4.69,15 0.94,19 0,19"/><polygon points="9.69,15 24,15 24,19 5.94,19"/><rect x="0" y="20" width="24" height="4"/></g></svg>
        <svg viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="River 32 px, dark"><g fill="#ECEDEF"><rect x="0" y="0" width="24" height="4"/><polygon points="0,5 14.06,5 10.31,9 0,9"/><polygon points="19.06,5 24,5 24,9 15.31,9"/><polygon points="0,10 9.38,10 5.62,14 0,14"/><polygon points="14.38,10 24,10 24,14 10.62,14"/><polygon points="0,15 4.69,15 0.94,19 0,19"/><polygon points="9.69,15 24,15 24,19 5.94,19"/><rect x="0" y="20" width="24" height="4"/></g></svg>
        <svg viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="River 96 px, dark"><g fill="#ECEDEF"><rect x="0" y="0" width="24" height="4"/><polygon points="0,5 14.06,5 10.31,9 0,9"/><polygon points="19.06,5 24,5 24,9 15.31,9"/><polygon points="0,10 9.38,10 5.62,14 0,14"/><polygon points="14.38,10 24,10 24,14 10.62,14"/><polygon points="0,15 4.69,15 0.94,19 0,19"/><polygon points="9.69,15 24,15 24,19 5.94,19"/><rect x="0" y="20" width="24" height="4"/></g></svg>
      </div>
    </div>

    <!-- 3C Prompt -->
    <div style="display: grid; grid-template-columns: 140px repeat(2, minmax(0, 1fr)); align-items: stretch">
      <div style="font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 500; align-self: center">3C Prompt</div>
      <div style="background: #FFFFFF; padding: 20px 24px; display: flex; align-items: flex-end; gap: 28px">
        <svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Prompt 16 px, light" shape-rendering="crispEdges"><g fill="#15171C"><rect x="0" y="0" width="8" height="3"/><rect x="4" y="4" width="8" height="2"/><rect x="4" y="10" width="8" height="2"/><rect x="0" y="13" width="8" height="3"/></g><rect x="8" y="7" width="8" height="2" fill="#985A00"/></svg>
        <svg viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Prompt 24 px, light" shape-rendering="crispEdges"><g fill="#15171C"><rect x="0" y="0" width="12" height="4"/><rect x="6" y="5" width="12" height="4"/><rect x="6" y="15" width="12" height="4"/><rect x="0" y="20" width="12" height="4"/></g><rect x="12" y="10" width="12" height="4" fill="#985A00"/></svg>
        <svg viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="Prompt 32 px, light" shape-rendering="crispEdges"><g fill="#15171C"><rect x="0" y="0" width="12" height="4"/><rect x="6" y="5" width="12" height="4"/><rect x="6" y="15" width="12" height="4"/><rect x="0" y="20" width="12" height="4"/></g><rect x="12" y="10" width="12" height="4" fill="#985A00"/></svg>
        <svg viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Prompt 96 px, light" shape-rendering="crispEdges"><g fill="#15171C"><rect x="0" y="0" width="12" height="4"/><rect x="6" y="5" width="12" height="4"/><rect x="6" y="15" width="12" height="4"/><rect x="0" y="20" width="12" height="4"/></g><rect x="12" y="10" width="12" height="4" fill="#985A00"/></svg>
      </div>
      <div style="background: #111318; padding: 20px 24px; display: flex; align-items: flex-end; gap: 28px">
        <svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Prompt 16 px, dark" shape-rendering="crispEdges"><g fill="#ECEDEF"><rect x="0" y="0" width="8" height="3"/><rect x="4" y="4" width="8" height="2"/><rect x="4" y="10" width="8" height="2"/><rect x="0" y="13" width="8" height="3"/></g><rect x="8" y="7" width="8" height="2" fill="#F5A524"/></svg>
        <svg viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Prompt 24 px, dark" shape-rendering="crispEdges"><g fill="#ECEDEF"><rect x="0" y="0" width="12" height="4"/><rect x="6" y="5" width="12" height="4"/><rect x="6" y="15" width="12" height="4"/><rect x="0" y="20" width="12" height="4"/></g><rect x="12" y="10" width="12" height="4" fill="#F5A524"/></svg>
        <svg viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="Prompt 32 px, dark" shape-rendering="crispEdges"><g fill="#ECEDEF"><rect x="0" y="0" width="12" height="4"/><rect x="6" y="5" width="12" height="4"/><rect x="6" y="15" width="12" height="4"/><rect x="0" y="20" width="12" height="4"/></g><rect x="12" y="10" width="12" height="4" fill="#F5A524"/></svg>
        <svg viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Prompt 96 px, dark" shape-rendering="crispEdges"><g fill="#ECEDEF"><rect x="0" y="0" width="12" height="4"/><rect x="6" y="5" width="12" height="4"/><rect x="6" y="15" width="12" height="4"/><rect x="0" y="20" width="12" height="4"/></g><rect x="12" y="10" width="12" height="4" fill="#F5A524"/></svg>
      </div>
    </div>

    <!-- 3D Log L -->
    <div style="display: grid; grid-template-columns: 140px repeat(2, minmax(0, 1fr)); align-items: stretch">
      <div style="font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 500; align-self: center">3D Log L</div>
      <div style="background: #FFFFFF; padding: 20px 24px; display: flex; align-items: flex-end; gap: 28px">
        <svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Log L 16 px, light" shape-rendering="crispEdges"><g fill="#15171C"><rect x="0" y="0" width="5" height="3"/><rect x="0" y="4" width="4" height="2"/><rect x="0" y="10" width="5" height="2"/><rect x="0" y="13" width="16" height="3"/></g><rect x="0" y="7" width="9" height="2" fill="#985A00"/></svg>
        <svg viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Log L 24 px, light" shape-rendering="crispEdges"><g fill="#15171C"><rect x="0" y="0" width="8" height="4"/><rect x="0" y="5" width="6" height="4"/><rect x="0" y="15" width="7" height="4"/><rect x="0" y="20" width="24" height="4"/></g><rect x="0" y="10" width="13" height="4" fill="#985A00"/></svg>
        <svg viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="Log L 32 px, light" shape-rendering="crispEdges"><g fill="#15171C"><rect x="0" y="0" width="8" height="4"/><rect x="0" y="5" width="6" height="4"/><rect x="0" y="15" width="7" height="4"/><rect x="0" y="20" width="24" height="4"/></g><rect x="0" y="10" width="13" height="4" fill="#985A00"/></svg>
        <svg viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Log L 96 px, light" shape-rendering="crispEdges"><g fill="#15171C"><rect x="0" y="0" width="8" height="4"/><rect x="0" y="5" width="6" height="4"/><rect x="0" y="15" width="7" height="4"/><rect x="0" y="20" width="24" height="4"/></g><rect x="0" y="10" width="13" height="4" fill="#985A00"/></svg>
      </div>
      <div style="background: #111318; padding: 20px 24px; display: flex; align-items: flex-end; gap: 28px">
        <svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Log L 16 px, dark" shape-rendering="crispEdges"><g fill="#ECEDEF"><rect x="0" y="0" width="5" height="3"/><rect x="0" y="4" width="4" height="2"/><rect x="0" y="10" width="5" height="2"/><rect x="0" y="13" width="16" height="3"/></g><rect x="0" y="7" width="9" height="2" fill="#F5A524"/></svg>
        <svg viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Log L 24 px, dark" shape-rendering="crispEdges"><g fill="#ECEDEF"><rect x="0" y="0" width="8" height="4"/><rect x="0" y="5" width="6" height="4"/><rect x="0" y="15" width="7" height="4"/><rect x="0" y="20" width="24" height="4"/></g><rect x="0" y="10" width="13" height="4" fill="#F5A524"/></svg>
        <svg viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="Log L 32 px, dark" shape-rendering="crispEdges"><g fill="#ECEDEF"><rect x="0" y="0" width="8" height="4"/><rect x="0" y="5" width="6" height="4"/><rect x="0" y="15" width="7" height="4"/><rect x="0" y="20" width="24" height="4"/></g><rect x="0" y="10" width="13" height="4" fill="#F5A524"/></svg>
        <svg viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Log L 96 px, dark" shape-rendering="crispEdges"><g fill="#ECEDEF"><rect x="0" y="0" width="8" height="4"/><rect x="0" y="5" width="6" height="4"/><rect x="0" y="15" width="7" height="4"/><rect x="0" y="20" width="24" height="4"/></g><rect x="0" y="10" width="13" height="4" fill="#F5A524"/></svg>
      </div>
    </div>
