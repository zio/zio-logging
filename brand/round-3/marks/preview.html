iv class="cell"><img data-zoom="24" src="tail-master-dark.svg" width="24" height="24"><span>24</span></div><div class="cell"><img data-zoom="32" src="tail-master-dark.svg" width="32" height="32"><span>32</span></div><div class="cell"><img data-zoom="96" src="tail-master-dark.svg" width="96" height="96"><span>96</span></div><canvas data-for="tail-dark"></canvas></div><div class="row" style="background:#FFFFFF;color:#15171C"><b>river / light</b><div class="cell"><img data-zoom="16" src="river-small-light.svg" width="16" height="16"><span>16</span></div><div class="cell"><img data-zoom="24" src="river-master-light.svg" width="24" height="24"><span>24</span></div><div class="cell"><img data-zoom="32" src="river-master-light.svg" width="32" height="32"><span>32</span></div><div class="cell"><img data-zoom="96" src="river-master-light.svg" width="96" height="96"><span>96</span></div><canvas data-for="river-light"></canvas></div><div class="row" style="background:#111318;color:#ECEDEF"><b>river / dark</b><div class="cell"><img data-zoom="16" src="river-small-dark.svg" width="16" height="16"><span>16</span></div><div class="cell"><img data-zoom="24" src="river-master-dark.svg" width="24" height="24"><span>24</span></div><div class="cell"><img data-zoom="32" src="river-master-dark.svg" width="32" height="32"><span>32</span></div><div class="cell"><img data-zoom="96" src="river-master-dark.svg" width="96" height="96"><span>96</span></div><canvas data-for="river-dark"></canvas></div><div class="row" style="background:#FFFFFF;color:#15171C"><b>prompt / light</b><div class="cell"><img data-zoom="16" src="prompt-small-light.svg" width="16" height="16"><span>16</span></div><div class="cell"><img data-zoom="24" src="prompt-master-light.svg" width="24" height="24"><span>24</span></div><div class="cell"><img data-zoom="32" src="prompt-master-light.svg" width="32" height="32"><span>32</span></div><div class="cell"><img data-zoom="96" src="prompt-master-light.svg" width="96" height="96"><span>96</span></div><canvas data-for="prompt-light"></canvas></div><div class="row" style="background:#111318;color:#ECEDEF"><b>prompt / dark</b><div class="cell"><img data-zoom="16" src="prompt-small-dark.svg" width="16" height="16"><span>16</span></div><div class="cell"><img data-zoom="24" src="prompt-master-dark.svg" width="24" height="24"><span>24</span></div><div class="cell"><img data-zoom="32" src="prompt-master-dark.svg" width="32" height="32"><span>32</span></div><div class="cell"><img data-zoom="96" src="prompt-master-dark.svg" width="96" height="96"><span>96</span></div><canvas data-for="prompt-dark"></canvas></div><div class="row" style="background:#FFFFFF;color:#15171C"><b>log-l / light</b><div class="cell"><img data-zoom="16" src="log-l-small-light.svg" width="16" height="16"><span>16</span></div><div class="cell"><img data-zoom="24" src="log-l-master-light.svg" width="24" height="24"><span>24</span></div><div class="cell"><img data-zoom="32" src="log-l-master-light.svg" width="32" height="32"><span>32</span></div><div class="cell"><img data-zoom="96" src="log-l-master-light.svg" width="96" height="96"><span>96</span></div><canvas data-for="log-l-light"></canvas></div><div class="row" style="background:#111318;color:#ECEDEF"><b>log-l / dark</b><div class="cell"><img data-zoom="16" src="log-l-small-dark.svg" width="16" height="16"><span>16</span></div><div class="cell"><img data-zoom="24" src="log-l-master-dark.svg" width="24" height="24"><span>24</span></div><div class="cell"><img data-zoom="32" src="log-l-master-dark.svg" width="32" height="32"><span>32</span></div><div class="cell"><img data-zoom="96" src="log-l-master-dark.svg" width="96" height="96"><span>96</span></div><canvas data-for="log-l-dark"></canvas></div>
<script>
// Zoom: draw each 16 and 24 px raster 8x with no smoothing, to judge pixels.
window.onload = () => document.querySelectorAll('.row').forEach(row => {
  const imgs = [...row.querySelectorAll('img')].filter(i => +i.dataset.zoom <= 24);
  const c = row.querySelector('canvas'); const z = 8;
  c.width = (16 + 24 + 8) * z; c.height = 24 * z;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  let x = 0;
  imgs.forEach(img => {
    const px = +img.dataset.zoom; const t = document.createElement('canvas');
    t.width = px; t.height = px; const tg = t.getContext('2d');
    tg.fillStyle = getComputedStyle(row).backgroundColor; tg.fillRect(0, 0, px, px);
    tg.drawImage(img, 0, 0, px, px);
    g.drawImage(t, x, 0, px * z, px * z); x += (px + 8) * z;
  });
});
</script>
