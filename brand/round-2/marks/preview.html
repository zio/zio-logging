<!doctype html><meta charset=utf-8><style>

.row b{width:140px}.cell{display:flex;flex-direction:column;align-items:center;gap:4px}
canvas{image-rendering:pixelated}</style><div class="row" style="background:#FFFFFF;color:#15171C"><b>lines / light</b><div class="cell"><img data-zoom="16" src="lines-small-light.svg" width="16" height="16"><span>16</span></div><div class="cell"><img data-zoom="24" src="lines-master-light.svg" width="24" height="24"><span>24</span></div><div class="cell"><img data-zoom="32" src="lines-master-light.svg" width="32" height="32"><span>32</span></div><div class="cell"><img data-zoom="96" src="lines-master-light.svg" width="96" height="96"><span>96</span></div><canvas data-for="lines-light"></canvas></div><div class="row" style="background:#111318;color:#ECEDEF"><b>lines / dark</b><div class="cell"><img data-zoom="16" src="lines-small-dark.svg" width="16" height="16"><span>16</span></div><div class="cell"><img data-zoom="24" src="lines-master-dark.svg" width="24" height="24"><span>24</span></div><div class="cell"><img data-zoom="32" src="lines-master-dark.svg" width="32" height="32"><span>32</span></div><div class="cell"><img data-zoom="96" src="lines-master-dark.svg" width="96" height="96"><span>96</span></div><canvas data-for="lines-dark"></canvas></div><div class="row" style="background:#FFFFFF;color:#15171C"><b>sliced / light</b><div class="cell"><img data-zoom="16" src="sliced-small-light.svg" width="16" height="16"><span>16</span></div><div class="cell"><img data-zoom="24" src="sliced-master-light.svg" width="24" height="24"><span>24</span></div><div class="cell"><img data-zoom="32" src="sliced-master-light.svg" width="32" height="32"><span>32</span></div><div class="cell"><img data-zoom="96" src="sliced-master-light.svg" width="96" height="96"><span>96</span></div><canvas data-for="sliced-light"></canvas></div><div class="row" style="background:#111318;color:#ECEDEF"><b>sliced / dark</b><div class="cell"><img data-zoom="16" src="sliced-small-dark.svg" width="16" height="16"><span>16</span></div><div class="cell"><img data-zoom="24" src="sliced-master-dark.svg" width="24" height="24"><span>24</span></div><div class="cell"><img data-zoom="32" src="sliced-master-dark.svg" width="32" height="32"><span>32</span></div><div class="cell"><img data-zoom="96" src="sliced-master-dark.svg" width="96" height="96"><span>96</span></div><canvas data-for="sliced-dark"></canvas></div><div class="row" style="background:#FFFFFF;color:#15171C"><b>return / light</b><div class="cell"><img data-zoom="16" src="return-small-light.svg" width="16" height="16"><span>16</span></div><div class="cell"><img data-zoom="24" src="return-master-light.svg" width="24" height="24"><span>24</span></div><div class="cell"><img data-zoom="32" src="return-master-light.svg" width="32" height="32"><span>32</span></div><div class="cell"><img data-zoom="96" src="return-master-light.svg" width="96" height="96"><span>96</span></div><canvas data-for="return-light"></canvas></div><div class="row" style="background:#111318;color:#ECEDEF"><b>return / dark</b><div class="cell"><img data-zoom="16" src="return-small-dark.svg" width="16" height="16"><span>16</span></div><div class="cell"><img data-zoom="24" src="return-master-dark.svg" width="24" height="24"><span>24</span></div><div class="cell"><img data-zoom="32" src="return-master-dark.svg" width="32" height="32"><span>32</span></div><div class="cell"><img data-zoom="96" src="return-master-dark.svg" width="96" height="96"><span>96</span></div><canvas data-for="return-dark"></canvas></div><div class="row" style="background:#FFFFFF;color:#15171C"><b>tagged-lines / light</b><div class="cell"><img data-zoom="16" src="tagged-lines-small-light.svg" width="16" height="16"><span>16</span></div><div class="cell"><img data-zoom="24" src="tagged-lines-master-light.svg" width="24" height="24"><span>24</span></div><div class="cell"><img data-zoom="32" src="tagged-lines-master-light.svg" width="32" height="32"><span>32</span></div><div class="cell"><img data-zoom="96" src="tagged-lines-master-light.svg" width="96" height="96"><span>96</span></div><canvas data-for="tagged-lines-light"></canvas></div><div class="row" style="background:#111318;color:#ECEDEF"><b>tagged-lines / dark</b><div class="cell"><img data-zoom="16" src="tagged-lines-small-dark.svg" width="16" height="16"><span>16</span></div><div class="cell"><img data-zoom="24" src="tagged-lines-master-dark.svg" width="24" height="24"><span>24</span></div><div class="cell"><img data-zoom="32" src="tagged-lines-master-dark.svg" width="32" height="32"><span>32</span></div><div class="cell"><img data-zoom="96" src="tagged-lines-master-dark.svg" width="96" height="96"><span>96</span></div><canvas data-for="tagged-lines-dark"></canvas></div>
<script>
// Zoom: draw each 16 and 24 px raster 8x with no smoothing, to judge pixels.
window.onload = () => document.querySelectorAll('.row').forEach(row => {
  const imgs = [...row.querySelectorAll('img')].filter(i => +i.dataset.zoom <= 24);
  const c = row.querySelector('canvas'); const z = 8;
  c.width = (16 + 24 + 8) * z; c.height = 24 * z;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  let x = 0;
  imgs.forEach(img => {
    const px = +img.dataset.zoom; const t = document.createElement('canvas');
    t.width = px; t.height = px; const tg = t.getContext('2d');
    tg.fillStyle = getComputedStyle(row).backgroundColor; tg.fillRect(0, 0, px, px);
    tg.drawImage(img, 0, 0, px, px);
    g.drawImage(t, x, 0, px * z, px * z); x += (px + 8) * z;
  });
});
</script>
