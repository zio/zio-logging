<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZIO Logging marks at 16, 24, 32 and 96 px</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#985A00}a:hover{color:#15171C}
</style>
</helmet>
<div style="width: 1120px; height: 800px; box-sizing: border-box; padding: 48px 56px; background: #F5F4F0; font-family: Geist, system-ui, sans-serif; color: #15171C; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #5B606B">True size · 16 px uses the small cut (16-unit grid), 24 px and up the master (24-unit grid)</div>
    <h2 style="margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -0.01em">16 · 24 · 32 · 96 px</h2>
  </div>

  <div style="display: grid; grid-template-columns: 120px repeat(2, minmax(0, 1fr)); gap: 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #5B606B; letter-spacing: 0.08em; text-transform: uppercase">
    <div></div><div style="padding-left: 24px">Light</div><div style="padding-left: 24px">Dark</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">

    <!-- Record -->
    <div style="display: grid; grid-template-columns: 120px repeat(2, minmax(0, 1fr)); align-items: stretch">
      <div style="font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 500; align-self: center">01 Record</div>
      <div style="background: #FFFFFF; padding: 20px 24px; display: flex; align-items: flex-end; gap: 28px">
        <svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Record 16 px, light" shape-rendering="crispEdges"><rect x="0" y="0" width="3" height="16" fill="#985A00"/><rect x="5" y="0" width="11" height="4" fill="#15171C"/><rect x="5" y="6" width="7" height="4" fill="#15171C"/><rect x="5" y="12" width="9" height="4" fill="#15171C"/></svg>
        <svg viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Record 24 px, light" shape-rendering="crispEdges"><rect x="0" y="0" width="4" height="24" fill="#985A00"/><rect x="7" y="0" width="17" height="6" fill="#15171C"/><rect x="7" y="9" width="12" height="6" fill="#15171C"/><rect x="7" y="18" width="15" height="6" fill="#15171C"/></svg>
        <svg viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="Record 32 px, light" shape-rendering="crispEdges"><rect x="0" y="0" width="4" height="24" fill="#985A00"/><rect x="7" y="0" width="17" height="6" fill="#15171C"/><rect x="7" y="9" width="12" height="6" fill="#15171C"/><rect x="7" y="18" width="15" height="6" fill="#15171C"/></svg>
        <svg viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Record 96 px, light" shape-rendering="crispEdges"><rect x="0" y="0" width="4" height="24" fill="#985A00"/><rect x="7" y="0" width="17" height="6" fill="#15171C"/><rect x="7" y="9" width="12" height="6" fill="#15171C"/><rect x="7" y="18" width="15" height="6" fill="#15171C"/></svg>
      </div>
      <div style="background: #111318; padding: 20px 24px; display: flex; align-items: flex-end; gap: 28px">
        <svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Record 16 px, dark" shape-rendering="crispEdges"><rect x="0" y="0" width="3" height="16" fill="#F5A524"/><rect x="5" y="0" width="11" height="4" fill="#ECEDEF"/><rect x="5" y="6" width="7" height="4" fill="#ECEDEF"/><rect x="5" y="12" width="9" height="4" fill="#ECEDEF"/></svg>

        <svg viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="Record 32 px, dark" shape-rendering="crispEdges"><rect x="0" y="0" width="4" height="24" fill="#F5A524"/><rect x="7" y="0" width="17" height="6" fill="#ECEDEF"/><rect x="7" y="9" width="12" height="6" fill="#ECEDEF"/><rect x="7" y="18" width="15" height="6" fill="#ECEDEF"/></svg>
        <svg viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Record 96 px, dark" shape-rendering="crispEdges"><rect x="0" y="0" width="4" height="24" fill="#F5A524"/><rect x="7" y="0" width="17" height="6" fill="#ECEDEF"/><rect x="7" y="9" width="12" height="6" fill="#ECEDEF"/><rect x="7" y="18" width="15" height="6" fill="#ECEDEF"/></svg>
      </div>
    </div>

    <!-- Tagged Z -->
    <div style="display: grid; grid-template-columns: 120px repeat(2, minmax(0, 1fr)); align-items: stretch">
      <div style="font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 500; align-self: center">02 Tagged Z</div>
      <div style="background: #FFFFFF; padding: 20px 24px; display: flex; align-items: flex-end; gap: 28px">
        <svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Tagged Z 16 px, light"><rect x="0" y="0" width="3" height="16" fill="#985A00"/><polygon points="5,0 16,0 16,3 9,13 16,13 16,16 5,16 5,13 12,3 5,3" fill="#15171C"/></svg>
        <svg viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Tagged Z 24 px, light"><rect x="0" y="0" width="4" height="24" fill="#985A00"/><polygon points="7,0 24,0 24,5 14,19 24,19 24,24 7,24 7,19 17,5 7,5" fill="#15171C"/></svg>

        <svg viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Tagged Z 96 px, light"><rect x="0" y="0" width="4" height="24" fill="#985A00"/><polygon points="7,0 24,0 24,5 14,19 24,19 24,24 7,24 7,19 17,5 7,5" fill="#15171C"/></svg>
      </div>
      <div style="background: #111318; padding: 20px 24px; display: flex; align-items: flex-end; gap: 28px">
        <svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Tagged Z 16 px, dark"><rect x="0" y="0" width="3" height="16" fill="#F5A524"/><polygon points="5,0 16,0 16,3 9,13 16,13 16,16 5,16 5,13 12,3 5,3" fill="#ECEDEF"/></svg>
        <svg viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Tagged Z 24 px, dark"><rect x="0" y="0" width="4" height="24" fill="#F5A524"/><polygon points="7,0 24,0 24,5 14,19 24,19 24,24 7,24 7,19 17,5 7,5" fill="#ECEDEF"/></svg>
        <svg viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="Tagged Z 32 px, dark"><rect x="0" y="0" width="4" height="24" fill="#F5A524"/><polygon points="7,0 24,0 24,5 14,19 24,19 24,24 7,24 7,19 17,5 7,5" fill="#ECEDEF"/></svg>
        <svg viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Tagged Z 96 px, dark"><rect x="0" y="0" width="4" height="24" fill="#F5A524"/><polygon points="7,0 24,0 24,5 14,19 24,19 24,24 7,24 7,19 17,5 7,5" fill="#ECEDEF"/></svg>
      </div>
    </div>

    <!-- Line Z -->
    <div style="display: grid; grid-template-columns: 120px repeat(2, minmax(0, 1fr)); align-items: stretch">
      <div style="font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 500; align-self: center">03 Line Z</div>
      <div style="background: #FFFFFF; padding: 20px 24px; display: flex; align-items: flex-end; gap: 28px">
        <svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Line Z 16 px, light" shape-rendering="crispEdges"><rect x="0" y="0" width="16" height="3" fill="#15171C"/><rect x="8" y="4" width="8" height="3" fill="#985A00"/><rect x="0" y="8" width="8" height="3" fill="#15171C"/><rect x="0" y="12" width="16" height="3" fill="#15171C"/></svg>
        <svg viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Line Z 24 px, light" shape-rendering="crispEdges"><rect x="0" y="0" width="24" height="4" fill="#15171C"/><rect x="14" y="5" width="10" height="4" fill="#15171C"/><rect x="7" y="10" width="10" height="4" fill="#985A00"/><rect x="0" y="15" width="10" height="4" fill="#15171C"/><rect x="0" y="20" width="24" height="4" fill="#15171C"/></svg>
        <svg viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="Line Z 32 px, light" shape-rendering="crispEdges"><rect x="0" y="0" width="24" height="4" fill="#15171C"/><rect x="14" y="5" width="10" height="4" fill="#15171C"/><rect x="7" y="10" width="10" height="4" fill="#985A00"/><rect x="0" y="15" width="10" height="4" fill="#15171C"/><rect x="0" y="20" width="24" height="4" fill="#15171C"/></svg>
        <svg viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Line Z 96 px, light" shape-rendering="crispEdges"><rect x="0" y="0" width="24" height="4" fill="#15171C"/><rect x="14" y="5" width="10" height="4" fill="#15171C"/><rect x="7" y="10" width="10" height="4" fill="#985A00"/><rect x="0" y="15" width="10" height="4" fill="#15171C"/><rect x="0" y="20" width="24" height="4" fill="#15171C"/></svg>
      </div>
      <div style="background: #111318; padding: 20px 24px; display: flex; align-items: flex-end; gap: 28px">
        <svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Line Z 16 px, dark" shape-rendering="crispEdges"><rect x="0" y="0" width="16" height="3" fill="#ECEDEF"/><rect x="8" y="4" width="8" height="3" fill="#F5A524"/><rect x="0" y="8" width="8" height="3" fill="#ECEDEF"/><rect x="0" y="12" width="16" height="3" fill="#ECEDEF"/></svg>
        <svg viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Line Z 24 px, dark" shape-rendering="crispEdges"><rect x="0" y="0" width="24" height="4" fill="#ECEDEF"/><rect x="14" y="5" width="10" height="4" fill="#ECEDEF"/><rect x="7" y="10" width="10" height="4" fill="#F5A524"/><rect x="0" y="15" width="10" height="4" fill="#ECEDEF"/><rect x="0" y="20" width="24" height="4" fill="#ECEDEF"/></svg>
        <svg viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="Line Z 32 px, dark" shape-rendering="crispEdges"><rect x="0" y="0" width="24" height="4" fill="#ECEDEF"/><rect x="14" y="5" width="10" height="4" fill="#ECEDEF"/><rect x="7" y="10" width="10" height="4" fill="#F5A524"/><rect x="0" y="15" width="10" height="4" fill="#ECEDEF"/><rect x="0" y="20" width="24" height="4" fill="#ECEDEF"/></svg>
        <svg viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Line Z 96 px, dark" shape-rendering="crispEdges"><rect x="0" y="0" width="24" height="4" fill="#ECEDEF"/><rect x="14" y="5" width="10" height="4" fill="#ECEDEF"/><rect x="7" y="10" width="10" height="4" fill="#F5A524"/><rect x="0" y="15" width="10" height="4" fill="#ECEDEF"/><rect x="0" y="20" width="24" height="4" fill="#ECEDEF"/></svg>
      </div>
    </div>

    <!-- Tail -->
    <div style="display: grid; grid-template-columns: 120px repeat(2, minmax(0, 1fr)); align-items: stretch">
      <div style="font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 500; align-self: center">04 Tail</div>
      <div style="background: #FFFFFF; padding: 20px 24px; display: flex; align-items: flex-end; gap: 28px">
        <svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Tail 16 px, light"><polygon points="0,0 11,0 11,3 4,13 11,13 11,16 0,16 0,13 7,3 0,3" fill="#15171C"/><rect x="13" y="6" width="3" height="10" fill="#985A00"/></svg>
        <svg viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Tail 24 px, light"><polygon points="0,0 16,0 16,5 7,19 16,19 16,24 0,24 0,19 9,5 0,5" fill="#15171C"/><rect x="19" y="10" width="5" height="14" fill="#985A00"/></svg>
        <svg viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="Tail 32 px, light"><polygon points="0,0 16,0 16,5 7,19 16,19 16,24 0,24 0,19 9,5 0,5" fill="#15171C"/><rect x="19" y="10" width="5" height="14" fill="#985A00"/></svg>
        <svg viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Tail 96 px, light"><polygon points="0,0 16,0 16,5 7,19 16,19 16,24 0,24 0,19 9,5 0,5" fill="#15171C"/><rect x="19" y="10" width="5" height="14" fill="#985A00"/></svg>
      </div>
      <div style="background: #111318; padding: 20px 24px; display: flex; align-items: flex-end; gap: 28px">
        <svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Tail 16 px, dark"><polygon points="0,0 11,0 11,3 4,13 11,13 11,16 0,16 0,13 7,3 0,3" fill="#ECEDEF"/><rect x="13" y="6" width="3" height="10" fill="#F5A524"/></svg>
        <svg viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Tail 24 px, dark"><polygon points="0,0 16,0 16,5 7,19 16,19 16,24 0,24 0,19 9,5 0,5" fill="#ECEDEF"/><rect x="19" y="10" width="5" height="14" fill="#F5A524"/></svg>
        <svg viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="Tail 32 px, dark"><polygon points="0,0 16,0 16,5 7,19 16,19 16,24 0,24 0,19 9,5 0,5" fill="#ECEDEF"/><rect x="19" y="10" width="5" height="14" fill="#F5A524"/></svg>
        <svg viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Tail 96 px, dark"><polygon points="0,0 16,0 16,5 7,19 16,19 16,24 0,24 0,19 9,5 0,5" fill="#ECEDEF"/><rect x="19" y="10" width="5" height="14" fill="#F5A524"/></svg>
      </div>
    </div>

  </div>
</div>
</x-dc>
